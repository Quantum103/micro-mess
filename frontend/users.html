<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlpineChat - Пользователи и Друзья</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="static/css/user.css">   

</head>
<body>
    <!-- Фоновые элементы (из login.html) -->
    <div class="snow" id="snow"></div>
    <div class="mountains">
        <div class="mountain" style="--scale: 1.1"></div>
        <div class="mountain" style="--scale: 0.85"></div>
        <div class="mountain" style="--scale: 1.2"></div>
        <div class="mountain" style="--scale: 0.9"></div>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <!-- Декоративные снежинки -->
        <div class="snowflake-deco">❄</div>
        <div class="snowflake-deco">❄</div>
        
<h2>
    <a href="dashboard.html" class="back-btn" title="На главную">
        <i class="fas fa-arrow-left"></i>
        <span class="back-text">На главную</span>
    </a>
    ❄️ AlpineChat — Друзья
</h2>     
        <!-- Вкладки (классы сохранены для JS) -->
        <div class="tabs">
            <button class="tab active" data-tab="all">Все пользователи</button>
            <button class="tab" data-tab="friends">Мои друзья</button>
        </div>

        <div id="error" class="error"></div>
        <div id="content"></div>
    </div>

    <script src="static/js/users.js"></script>

</body>
</html>
