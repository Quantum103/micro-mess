<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlpineChat - Мессенджер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* СНЕГ */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* ГОРЫ НА ФОНЕ */
        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 1;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to bottom, #4a5568 0%, #2d3748 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: scale(var(--scale));
            transform-origin: bottom center;
            opacity: 0.5;
        }

        .mountain:nth-child(1) { left: 5%; --scale: 1.2; z-index: 1; }
        .mountain:nth-child(2) { left: 30%; --scale: 0.9; z-index: 2; opacity: 0.7; }
        .mountain:nth-child(3) { left: 55%; --scale: 1.1; z-index: 1; }
        .mountain:nth-child(4) { left: 80%; --scale: 0.85; z-index: 2; opacity: 0.6; }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        #users, #chat {
            position: relative;
            z-index: 10;
        }

        /* СПИСОК ПОЛЬЗОВАТЕЛЕЙ */
        #users {
            width: 280px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 0;
        }

        #users::-webkit-scrollbar {
            width: 6px;
        }

        #users::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        #users::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .user {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            color: #e2e8f0;
        }

        .user:hover {
            background: rgba(66, 153, 225, 0.2);
            transform: translateX(4px);
        }

        .user.active {
            background: rgba(66, 153, 225, 0.4);
            border-left: 3px solid #4299e1;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4299e1, #667eea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 16px;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .user-status {
            font-size: 11px;
            color: #a0aec0;
        }

        .user-status.online {
            color: #48bb78;
        }

        /* CHAT */
        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
        }

        #header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.1);
        }

        #header i {
            color: #4299e1;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .me {
            align-self: flex-end;
            background: linear-gradient(135deg, #4299e1, #667eea);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        /* INPUT BOX */
        #inputBox {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.1);
            gap: 10px;
        }

        #inputBox input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #inputBox input::placeholder {
            color: #a0aec0;
        }

        #inputBox input:focus {
            border-color: #4299e1;
            background: rgba(255, 255, 255, 0.15);
        }

        #inputBox button {
            padding: 14px 24px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #4299e1, #667eea);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #inputBox button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4);
        }

        #inputBox button:active {
            transform: translateY(0);
        }

        /* ДЕКОРАТИВНЫЕ СНЕЖИНКИ В ИНТЕРФЕЙСЕ */
        .snowflake-deco {
            position: absolute;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(180deg); }
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            #users {
                width: 70px;
                padding: 10px 0;
            }
            .user-name, .user-status {
                display: none;
            }
            .user-avatar {
                margin: 0 auto;
            }
            .user {
                justify-content: center;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- СНЕГ -->
    <div class="snow" id="snow"></div>
    
    <!-- ГОРЫ -->
    <div class="mountains">
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
        <div class="mountain"></div>
    </div>

    <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ -->
    <div id="users"></div>

    <!-- ЧАТ -->
    <div id="chat">
        <div id="header">
            <i class="fas fa-comments"></i>
            <span>Выберите пользователя</span>
        </div>
        <div id="messages"></div>

        <div id="inputBox">
            <input id="messageInput" placeholder="Напишите сообщение..." />
            <button onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
                Отправить
            </button>
        </div>
    </div>

    <script>
        // ========================================
        // СОЗДАНИЕ СНЕЖИНОК (та же логика)
        // ========================================
        function createSnowflakes() {
            const snowContainer = document.getElementById('snow');
            const snowflakeCount = 50;
            
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                
                const size = Math.random() * 4 + 2;
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                
                snowflake.style.left = `${Math.random() * 100}%`;
                snowflake.style.top = `${Math.random() * 100}%`;
                
                const duration = Math.random() * 12 + 6;
                snowflake.style.animationDuration = `${duration}s`;
                
                const delay = Math.random() * 5;
                snowflake.style.animationDelay = `${delay}s`;
                
                snowContainer.appendChild(snowflake);
            }
        }

        // Инициализация снега при загрузке
        window.addEventListener('load', createSnowflakes);
    </script>
    
    <script src="static/js/chat.js"></script>
</body>
</html>
